# Publishes the museum to GitHub Pages.
#
# This replaced the old "deploy branch main / as-is" setup on 2026-08-30. The only difference
# from serving the branch directly is that .github/prune_unserved_originals.py drops the held
# originals that no page links, so they stop counting against the 1 GB Pages cap. The originals
# remain in the repository untouched — see that script's docstring.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1          # the history is ~1 GB; the tip is all we publish

      - name: Drop originals the site never serves
        run: python3 .github/prune_unserved_originals.py

      - uses: actions/configure-pages@v5

      # upload-pages-artifact excludes .git and .github itself.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
