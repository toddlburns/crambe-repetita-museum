<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>artist: Frank Stella — Crambe Repetita Museum</title><link rel="stylesheet" href="../../../style.css"></head><body><div class="crumb"><span class="t">ARTIST: FRANK STELLA</span><span class="c">6 items</span><a href="../../../tags/">&#8592; all tags</a></div><div class="grid"><a class="cell" href="../../../CRVI001876/"><div class="inner"><img src="../../../thumbs/CRVI001876.jpg" loading="lazy" alt=""></div><div class="cap"><span class="n">CRVI001876</span>Frank Stella - Jill<br>1959</div></a><a class="cell" href="../../../CRVI001877/"><div class="inner"><img src="../../../thumbs/CRVI001877.jpg" loading="lazy" alt=""></div><div class="cap"><span class="n">CRVI001877</span>Frank Stella - Hampton Roads<br>1961</div></a><a class="cell" href="../../../CRVI001878/"><div class="inner"><img src="../../../thumbs/CRVI001878.jpg" loading="lazy" alt=""></div><div class="cap"><span class="n">CRVI001878</span>Frank Stella - Gran Cairo<br>1962</div></a><a class="cell" href="../../../CRVI002276/"><div class="inner"><img src="../../../thumbs/CRVI002276.jpg" loading="lazy" alt=""></div><div class="cap"><span class="n">CRVI002276</span>Frank Stella - Untitled<br>1974</div></a><a class="cell" href="../../../CRVI002277/"><div class="inner"><img src="../../../thumbs/CRVI002277.jpg" loading="lazy" alt=""></div><div class="cap"><span class="n">CRVI002277</span>Frank Stella - Feneralia, from Imaginary Places<br></div></a><a class="cell" href="../../../CRVI002278/"><div class="inner"><img src="../../../thumbs/CRVI002278.jpg" loading="lazy" alt=""></div><div class="cap"><span class="n">CRVI002278</span>Frank Stella - Untitled<br></div></a></div><script>
var SCALE=3;var t=null;
// ⚠️ THE GIF IS FETCHED ON HOVER, NOT BEFORE. Setting src is what triggers the download, so a
// grid cell ships the still poster and only swaps in the animation when the pointer arrives.
// Pausing or hiding a GIF whose src is already set saves nothing — it is on the wire either way.
// The poster is kept in data-poster so leaving restores it without a second fetch of anything.
function playGif(c){
  var im=c.querySelector('img.anim');
  if(!im) return;
  var g=im.getAttribute('data-gif');
  if(!g||im.dataset.playing) return;
  im.dataset.poster=im.getAttribute('src');
  im.dataset.playing='1';
  im.setAttribute('src',g);
}
function stopGif(c){
  var im=c.querySelector('img.anim');
  if(!im||!im.dataset.playing) return;
  // back to the still, so a page full of gifs is not left all animating at once
  im.setAttribute('src',im.dataset.poster);
  delete im.dataset.playing;
}
// ⚠️ A VIDEO CANNOT BE SWAPPED INTO AN <img>. Where a gif item just changes src, a video item
// lays a <video> over its still on hover and takes it away again on leave — same bargain as the
// gif: nothing is on the wire until the pointer arrives, and a grid is never left all playing.
function playVid(c){
  var im=c.querySelector('img.anim'); if(!im) return;
  var u=im.getAttribute('data-video'); if(!u||c.querySelector('video')) return;
  var v=document.createElement('video');
  v.src=u; v.autoplay=true; v.loop=true; v.muted=true; v.playsInline=true;
  im.parentNode.appendChild(v);
}
function stopVid(c){ var v=c.querySelector('video'); if(v) v.parentNode.removeChild(v); }
document.querySelectorAll('.cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){
    playGif(c); playVid(c);
    clearTimeout(t);
    t=setTimeout(function(){
      // transform does not change layout, so push the caption below the grown image
      var im=c.querySelector('img'),cap=c.querySelector('.cap');
      cap.style.transform='translateY('+im.getBoundingClientRect().height*(SCALE-1)+'px)';
      c.classList.add('big');
    },1000);
  });
  c.addEventListener('mouseleave',function(){
    stopGif(c); stopVid(c);
    clearTimeout(t);c.classList.remove('big');c.querySelector('.cap').style.transform='';
  });
});
</script></body></html>
