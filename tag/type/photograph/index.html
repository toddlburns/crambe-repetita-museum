<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>type: photograph — Crambe Repetita Museum</title><link rel="stylesheet" href="../../../style.css"></head><body><div class="crumb"><span class="t">TYPE: PHOTOGRAPH</span><span class="c">2 items</span><a href="../../../tags/">&#8592; all tags</a></div><div class="grid"><a class="cell" href="../../../CRVI000216/"><div class="inner"><img src="../../../images/CRVI000216.jpg" alt=""></div><div class="cap"><span class="n">CRVI000216</span>Yayoi Kusama - Kusama with paper works, Tokyo<br>Photographed among her works on paper · via David Zwirner · 1957</div></a><a class="cell" href="../../../CRVI000218/"><div class="inner"><img src="../../../images/CRVI000218.jpg" alt=""></div><div class="cap"><span class="n">CRVI000218</span>Yayoi Kusama - Kusama painting, Tokyo<br>Photograph by Motohiko Hasui · at the media preview of the Yayoi Kusama Museum · 2017</div></a></div><script>
var SCALE=3;var t=null;
document.querySelectorAll('.cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){
    clearTimeout(t);
    t=setTimeout(function(){
      // transform does not change layout, so push the caption below the grown image
      var im=c.querySelector('img'),cap=c.querySelector('.cap');
      cap.style.transform='translateY('+im.getBoundingClientRect().height*(SCALE-1)+'px)';
      c.classList.add('big');
    },1000);
  });
  c.addEventListener('mouseleave',function(){
    clearTimeout(t);c.classList.remove('big');c.querySelector('.cap').style.transform='';
  });
});
</script></body></html>
