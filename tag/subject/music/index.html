<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>subject: music — Crambe Repetita Museum</title><link rel="stylesheet" href="../../../style.css"></head><body><div class="crumb"><span class="t">SUBJECT: MUSIC</span><span class="c">2 items</span><a href="../../../tags/">&#8592; all tags</a></div><div class="grid"><a class="cell" href="../../../CRVI000123/"><div class="inner"><img src="../../../images/CRVI000123.jpg" alt=""></div><div class="cap"><span class="n">CRVI000123</span>Shigeo Fukuda - Jazz Festival Montreux<br>19e Festival de Jazz Montreux, 5–20 juillet 1985 · 100 x 70 cm · 1985</div></a><a class="cell" href="../../../CRVI000130/"><div class="inner"><img src="../../../images/CRVI000130.jpg" alt=""></div><div class="cap"><span class="n">CRVI000130</span>Koichi Sato - New Music Media, New Magic Media<br>1974</div></a></div><script>
var SCALE=3;var t=null;
document.querySelectorAll('.cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){
    clearTimeout(t);
    t=setTimeout(function(){
      // transform does not change layout, so push the caption below the grown image
      var im=c.querySelector('img'),cap=c.querySelector('.cap');
      cap.style.transform='translateY('+im.getBoundingClientRect().height*(SCALE-1)+'px)';

    },1000);
  });
  c.addEventListener('mouseleave',function(){
    clearTimeout(t);c.classList.remove('big');c.querySelector('.cap').style.transform='';
  });
});
</script></body></html>
