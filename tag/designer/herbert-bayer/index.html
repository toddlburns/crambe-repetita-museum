<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>designer: Herbert Bayer — Crambe Repetita Museum</title><link rel="stylesheet" href="../../../style.css"></head><body><div class="crumb"><span class="t">DESIGNER: HERBERT BAYER</span><span class="c">2 items</span><a href="../../../tags/">&#8592; all tags</a></div><div class="grid"><a class="cell" href="../../../CRVI000286/"><div class="inner"><img src="../../../images/CRVI000286.jpg" alt=""></div><div class="cap"><span class="n">CRVI000286</span>Herbert Bayer - Bauhaus Exhibition Poster - 50 Years of Bauhaus<br>Poster</div></a><a class="cell" href="../../../CRVI000287/"><div class="inner"><img src="../../../images/CRVI000287.jpg" alt=""></div><div class="cap"><span class="n">CRVI000287</span>Herbert Bayer - Bauhaus Exhibition Poster<br>Poster</div></a></div><script>
var SCALE=3;var t=null;
document.querySelectorAll('.cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){
    clearTimeout(t);
    t=setTimeout(function(){
      // transform does not change layout, so push the caption below the grown image
      var im=c.querySelector('img'),cap=c.querySelector('.cap');

  c.addEventListener('mouseleave',function(){
    clearTimeout(t);c.classList.remove('big');c.querySelector('.cap').style.transform='';
  });
});
</script></body></html>
