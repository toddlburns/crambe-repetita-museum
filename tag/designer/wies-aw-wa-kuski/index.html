<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>designer: Wiesław Wałkuski — Crambe Repetita Museum</title><link rel="stylesheet" href="../../../style.css"></head><body><div class="crumb"><span class="t">DESIGNER: WIESŁAW WAŁKUSKI</span><span class="c">2 items</span><a href="../../../tags/">&#8592; all tags</a></div><div class="grid"><a class="cell" href="../../../CRVI000251/"><div class="inner"><img src="../../../images/CRVI000251.jpg" alt=""></div><div class="cap"><span class="n">CRVI000251</span>Wiesław Wałkuski - Scruple<br>Film Poster Designed By Wiesław Wałkuski · 2000 · 2000</div></a><a class="cell" href="../../../CRVI000256/"><div class="inner"><img src="../../../images/CRVI000256.jpg" alt=""></div><div class="cap"><span class="n">CRVI000256</span>Wiesław Wałkuski - The Idiots<br>Film Poster Designed By Wiesław Wałkuski · 1999 · 1999</div></a></div><script>
var SCALE=3;var t=null;
document.querySelectorAll('.cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){
    clearTimeout(t);
    t=setTimeout(function(){
      // transform does not change layout, so push the caption below the grown image
      var im=c.querySelector('img'),cap=c.querySelector('.cap');
      cap.style.transform='translateY('+im.getBoundingClientRect().height*(SCALE-1)+'px)';
      c.classList.add('big');
    },1000);
  });
  c.addEventListener('mouseleave',function(){
    clearTimeout(t);c.classList.remove('big');c.querySelector('.cap').style.transform='';
  });
});
</script></body></html>
