<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>label: Virgin — Crambe Repetita Museum</title><link rel="stylesheet" href="../../../style.css"></head><body><div class="crumb"><span class="t">LABEL: VIRGIN</span><span class="c">3 items</span><a href="../../../tags/">&#8592; all tags</a></div><div class="grid"><a class="cell" href="../../../CRVI000009/"><div class="inner"><img src="../../../thumbs/CRVI000009.jpg" alt=""></div><div class="cap"><span class="n">CRVI000009</span>The Future Sound Of London - Lifeforms<br>Artwork by Buggy G. Riphead · Virgin · 1994</div></a><a class="cell" href="../../../CRVI000093/"><div class="inner"><img src="../../../thumbs/CRVI000093.jpg" alt=""></div><div class="cap"><span class="n">CRVI000093</span>Cabaret Voltaire - The Crackdown<br>Designer unknown · Virgin · 1983</div></a><a class="cell" href="../../../CRVI000312/"><div class="inner"><img src="../../../thumbs/CRVI000312.jpg" alt=""></div><div class="cap"><span class="n">CRVI000312</span>The Human League - Reproduction<br>Designer unknown · Virgin · 1979</div></a></div><script>
var SCALE=3;var t=null;
// ⚠️ THE GIF IS FETCHED ON HOVER, NOT BEFORE. Setting src is what triggers the download, so a
// grid cell ships the still poster and only swaps in the animation when the pointer arrives.
// Pausing or hiding a GIF whose src is already set saves nothing — it is on the wire either way.
// The poster is kept in data-poster so leaving restores it without a second fetch of anything.
function playGif(c){
  var im=c.querySelector('img.anim');
  if(!im) return;
  var g=im.getAttribute('data-gif');
  if(!g||im.dataset.playing) return;
  im.dataset.poster=im.getAttribute('src');
  im.dataset.playing='1';
  im.setAttribute('src',g);
}
function stopGif(c){
  var im=c.querySelector('img.anim');
  if(!im||!im.dataset.playing) return;
  // back to the still, so a page full of gifs is not left all animating at once
  im.setAttribute('src',im.dataset.poster);
  delete im.dataset.playing;
}
document.querySelectorAll('.cell').forEach(function(c){
  c.addEventListener('mouseenter',function(){
    playGif(c);
    clearTimeout(t);
    t=setTimeout(function(){
      // transform does not change layout, so push the caption below the grown image
      var im=c.querySelector('img'),cap=c.querySelector('.cap');
      cap.style.transform='translateY('+im.getBoundingClientRect().height*(SCALE-1)+'px)';
      c.classList.add('big');
    },1000);
  });
  c.addEventListener('mouseleave',function(){
    stopGif(c);
    clearTimeout(t);c.classList.remove('big');c.querySelector('.cap').style.transform='';
  });
});
</script></body></html>
